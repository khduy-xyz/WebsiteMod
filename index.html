<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khuong Duy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
:root {
  --bg-main: #f8f9fa;
  --bg-card: #ffffff;
  --text-main: #333333;
  --text-muted: #777777;
  --border-color: #e0e0e0;
  --shadow-color: rgba(0,0,0,0.08);
  --nav-bg: rgba(255,255,255,0.9);
  --btn-primary: #1e1e1e;
  --btn-text: #fff;
  --btn-sub: #f1f1f1;
  --btn-sub-text: #333;
}

body.vthangios-dark {
  --bg-main: #0f172a;
  --bg-card: #1e293b;
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  --border-color: #334155;
  --shadow-color: rgba(0,0,0,0.3);
  --nav-bg: rgba(15,23,42,0.9);
  --btn-primary: #3b82f6;
  --btn-text: #fff;
  --btn-sub: #334155;
  --btn-sub-text: #fff;
}

* { margin:0; padding:0; box-sizing:border-box; font-family:'Quicksand', sans-serif; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg-main);
  color: var(--text-main);
  transition: all 0.3s ease;
  padding-bottom: 50px;
}

.vthangios-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; justify-content: flex-end; gap: 10px;
  padding: 15px 20px;
  background: var(--nav-bg);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border-color);
}
.vthangios-bell-btn, .vthangios-theme-btn {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--bg-card); border: 1px solid var(--border-color);
  color: var(--text-main); font-size: 1.1rem;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; box-shadow: 0 2px 10px var(--shadow-color);
}

main { max-width: 650px; margin: 0 auto; padding-top: 80px; text-align: center; }

.vthangios-avatar-wrap {
  position: relative; width: 130px; height: 130px;
  margin: 0 auto 15px;
  background: var(--border-color);
  border-radius: 50%;
}
.vthangios-avatar {
  width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
  border: 4px solid var(--bg-card); box-shadow: 0 4px 15px var(--shadow-color);
  position: relative; z-index: 2;
}
.vthangios-avatar-frame {
  position: absolute; top: -8px; left: -8px; width: calc(100% + 16px); height: calc(100% + 16px);
  z-index: 1; border-radius: 50%; border: 2px dashed var(--btn-primary);
  animation: spin 8s linear infinite;
  pointer-events: none;
}
@keyframes spin { 100% { transform: rotate(360deg); } }

.vthangios-iam { font-size: 0.95rem; color: var(--text-muted); font-weight: 600; margin-bottom: 5px; }

.vthangios-name {
  font-size: 1.7rem; font-weight: 800; margin: 5px 0 20px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.neon-text {
  background: linear-gradient(90deg, #ff007f, #ff8c00, #ffd700, #00ff00, #00ffff, #007bff, #8a2be2, #ff007f);
  background-size: 300% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: neon-flow 4s linear infinite;
  filter: drop-shadow(0 0 5px rgba(255, 0, 127, 0.4));
}
@keyframes neon-flow {
  0% { background-position: 0% 50%; }
  100% { background-position: 100% 50%; }
}

.vthangios-socials { display: flex; justify-content: center; gap: 15px; margin: 25px 0 30px; }
.vthangios-social-item { transition: transform 0.2s; }
.vthangios-social-item:hover { transform: translateY(-5px) scale(1.1); }

.vthangios-app-section { padding: 0 20px; text-align: left; }

.vthangios-app-entry {
  margin-bottom: 25px; background: var(--bg-card); border-radius: 20px;
  box-shadow: 0 4px 15px var(--shadow-color); overflow: hidden;
  border: 1px solid var(--border-color); transition: transform 0.3s;
}
.vthangios-app-entry:hover { transform: translateY(-3px); }

.vthangios-app-banner { width: 100%; height: 200px; position: relative; background: var(--border-color); display: flex; align-items: center; justify-content: center; }
.vthangios-app-banner img { width: 100%; height: 100%; object-fit: cover; }
.vthangios-app-banner-badges { position: absolute; top: 12px; left: 12px; display: flex; gap: 8px; }
.vthangios-platform-badge {
  background: rgba(0,0,0,0.7); color: #fff; padding: 5px 12px;
  border-radius: 20px; font-size: 0.8rem; font-weight: 700;
  backdrop-filter: blur(5px); display: flex; align-items: center; gap: 5px;
}

.vthangios-app-info { padding: 20px; position: relative; }
.vthangios-app-icon-wrap {
  position: absolute; top: -45px; left: 20px;
  width: 80px; height: 80px; border-radius: 18px; background: var(--bg-card);
  border: 3px solid var(--bg-card); box-shadow: 0 5px 15px var(--shadow-color);
  overflow: hidden; z-index: 2;
}
.vthangios-app-icon-wrap img { width: 100%; height: 100%; object-fit: cover; }

.vthangios-app-name { display: block; font-size: 1.15rem; font-weight: 800; margin-top: 20px; margin-bottom: 4px; }
.vthangios-app-desc { font-size: 0.9rem; color: var(--text-muted); font-style: italic; }

.vthangios-app-actions { 
  display: flex; 
  flex-direction: column; 
  gap: 10px; 
  margin-top: 15px; 
}
.vthangios-app-actions button, .vthangios-app-actions a {
  width: 100%; 
  padding: 12px 10px; border-radius: 12px;
  font-size: 0.95rem; font-weight: 700; display: flex; align-items: center;
  justify-content: center; gap: 8px; text-decoration: none; cursor: pointer;
  transition: all 0.2s; border: none;
}

.vthangios-download-btn {
  background: var(--btn-primary); color: var(--btn-text);
  box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
}
.vthangios-download-btn:hover { opacity: 0.9; transform: translateY(-2px); }

.vthangios-app-getkey.is-main { background: var(--btn-sub); color: var(--btn-sub-text); }
.vthangios-app-getkey:hover { opacity: 0.8; transform: translateY(-2px); }

.btn-dash {
  background: #10b981; color: #fff;
  box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
}
.btn-dash:hover { opacity: 0.9; transform: translateY(-2px); }

.vthangios-footer { text-align: center; font-size: 0.9rem; color: var(--text-muted); padding: 30px 20px; border-top: 1px solid var(--border-color); margin-top: 40px; }
</style>
</head>
<body>

<script>
  (function(){
    var t=null;
    try{ t=localStorage.getItem('vthangios_theme_v2') }catch(e){}
    if(t==='dark') {
      document.body.classList.add('vthangios-dark');
    }
  })();
</script>

<main role="main">
  <nav class="vthangios-nav" aria-label="Điều hướng chính">
    <button class="vthangios-bell-btn" aria-label="Thông báo">
      <i class="fas fa-bell"></i>
    </button>
    <button class="vthangios-theme-btn" onclick="vtToggleTheme()" aria-label="Chuyển chế độ">
      <i class="bi bi-moon-fill" id="theme-icon"></i>
    </button>
  </nav>

  <div class="vthangios-avatar-wrap has-frame">
    <img class="vthangios-avatar" src="https://copium.pics/4qjepM2C.jpg" alt="Khuong Duy">
    <div class="vthangios-avatar-frame"></div>
  </div>

  <p class="vthangios-iam">Hi, i am</p>
  <h1 class="vthangios-name">
    <span class="neon-text">Khuong Duy</span>
    <i class="fas fa-check-circle" style="color: #3b82f6; font-size: 1.3rem;"></i>
  </h1>

  <div class="vthangios-socials">
    <a href="https://discord.gg/7t3P5zpu" class="vthangios-social-item" target="_blank">
      <i class="fa-brands fa-discord" style="color:#5865F2; font-size: 45px;"></i>
    </a>
    <a href="https://t.me/khduylato" class="vthangios-social-item" target="_blank">
      <i class="fa-brands fa-telegram" style="color:#2AABEE; font-size: 45px;"></i>
    </a>
    <a href="https://www.youtube.com/@khuongduylato" class="vthangios-social-item" target="_blank">
      <i class="fa-brands fa-youtube" style="color:#FF0000; font-size: 45px;"></i>
    </a>
  </div>

  <section class="vthangios-app-section" aria-label="Danh sách ứng dụng">
    <div class="vthangios-group-block" id="app-list">
      <!-- App sẽ render ở đây -->
    </div>
  </section>

  <footer class="vthangios-footer">
    &copy; Designer by Khuong Duy 2026
  </footer>
</main>

<script>
const apps = [
  { 
    name: "FFARIS MỚI NHẤT OB55", 
    date: "Fix Dame - Fix Lag - Nhìn Thấy Đồ", 
    platform: "both", 
    bannerImg: "https://copium.pics/54vkwPcd.jpg", 
    iconImg: "https://copium.pics/cFMAru7F.jpg",
    
    downloadLink: "https://link4m.net/HXMun", 
    // ĐÂY LÀ CHỖ TRỎ SANG TRANG UNLOCK.HTML
    unlockIdLink: "unlock.html", 
    dashLink: ""      
  },
];

function renderApps() {
  const container = document.getElementById("app-list");
  if (apps.length === 0) {
    container.innerHTML += `<p style="text-align:center; color:#888; margin-top:20px;">Chưa có app nào được thêm...</p>`;
    return;
  }

  let html = '';
  apps.forEach(app => {
    let badge = '';
    if (app.platform === 'ios') {
      badge = `<span class="vthangios-platform-badge"><i class="fab fa-apple"></i> iOS</span>`;
    } else if (app.platform === 'android') {
      badge = `<span class="vthangios-platform-badge"><i class="bi bi-android2"></i> Android</span>`;
    } else if (app.platform === 'both') {
      badge = `
        <span class="vthangios-platform-badge"><i class="fab fa-apple"></i> iOS</span>
        <span class="vthangios-platform-badge"><i class="bi bi-android2"></i> Android</span>
      `;
    }

    let banner = app.bannerImg ? `<img src="${app.bannerImg}" alt="${app.name}">` : '';
    let icon = app.iconImg ? `<img src="${app.iconImg}" alt="${app.name}">` : '';

    let actions = '';
    
    if (app.downloadLink) {
      actions += `<a href="${app.downloadLink}" target="_blank" class="vthangios-download-btn vthangios-app-cta"><i class="bi bi-download"></i> Download</a>`;
    } else {
      actions += `<button onclick="alert('Đang cập nhật link Download!')" class="vthangios-download-btn vthangios-app-cta"><i class="bi bi-download"></i> Download</button>`;
    }
    
    if (app.unlockIdLink) {
      // TRỎ SANG TRANG UNLOCK.HTML
      actions += `<a href="${app.unlockIdLink}" class="vthangios-app-getkey is-main"><i class="fa-solid fa-unlock-keyhole"></i> Unlock ID</a>`;
    } else {
      actions += `<button onclick="alert('Đang cập nhật link Unlock ID!')" class="vthangios-app-getkey is-main"><i class="fa-solid fa-unlock-keyhole"></i> Unlock ID</button>`;
    }

    if (app.dashLink) {
      actions += `<a href="${app.dashLink}" target="_blank" class="btn-dash"><i class="fa-solid fa-gauge-high"></i> FFARIS Dash</a>`;
    } else {
      actions += `<button onclick="alert('Đang cập nhật link FFARIS Dash!')" class="btn-dash"><i class="fa-solid fa-gauge-high"></i> FFARIS Dash</button>`;
    }

    html += `
    <div class="vthangios-app-entry">
      <div class="vthangios-app-item">
        <div class="vthangios-app-banner">
          ${banner}
          <span class="vthangios-app-banner-badges">${badge}</span>
        </div>
        <div class="vthangios-app-info">
          <div class="vthangios-app-icon-wrap">
            ${icon}
          </div>
          <div>
            <span class="vthangios-app-name">${app.name}</span>
            <span class="vthangios-app-desc">${app.date}</span>
          </div>
          <div class="vthangios-app-actions">
            ${actions}
          </div>
        </div>
      </div>
    </div>
    `;
  });
  container.innerHTML += html;
}

renderApps();

function vtToggleTheme() {
  const body = document.body;
  const icon = document.getElementById('theme-icon');
  body.classList.toggle('vthangios-dark');
  
  if (body.classList.contains('vthangios-dark')) {
    icon.className = 'bi bi-sun-fill';
    localStorage.setItem('vthangios_theme_v2', 'dark');
  } else {
    icon.className = 'bi bi-moon-fill';
    localStorage.setItem('vthangios_theme_v2', 'light');
  }
}
</script>
</body>
</html>
