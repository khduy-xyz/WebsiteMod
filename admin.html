<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Khuong Duy</title>
    <style>
        :root {
            --bg: #0f0f1a; --panel-bg: #1a1a2e; --text: #fff; --text-muted: #a0a0b0;
            --border: #2a2a3e; --primary: #3b82f6; --danger: #ef4444; --success: #22c55e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        .header h1 { font-size: 1.5rem; color: var(--primary); }
        .btn-logout { background: var(--danger); color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .section { background: var(--panel-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        .section h2 { font-size: 1.2rem; margin-bottom: 15px; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg); color: var(--text); outline: none; font-family: inherit;
        }
        .btn-submit { background: var(--success); color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }

        .mod-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .mod-item { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 12px; padding: 15px; position: relative; display: flex; flex-direction: column; gap: 10px; }
        .mod-item img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; background: #000; }
        .mod-info h3 { font-size: 1rem; margin-bottom: 5px; text-transform: uppercase; }
        .mod-info p { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 3px; word-break: break-all; }
        .mod-info .link { color: var(--primary); text-decoration: none; font-size: 0.8rem; }
        
        .action-btns { display: flex; gap: 10px; margin-top: auto; }
        .btn-edit { background: var(--primary); color: #fff; border: none; padding: 8px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; flex: 1; }
        .btn-delete { background: var(--danger); color: #fff; border: none; padding: 8px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; flex: 1; }
        
        /* Modal Sửa Bài */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--panel-bg); padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; position: relative; }
        .modal-close { position: absolute; top: 10px; right: 15px; background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Quản Trị Website</h1>
        <button class="btn-logout" onclick="logout()">Đăng Xuất</button>
    </div>

    <!-- 1. Quản lý thông tin chung -->
    <div class="section">
        <h2>Thông Tin Cơ Bản</h2>
        <div class="form-group">
            <label>Tên hiển thị (Name)</label>
            <input type="text" id="cfgName">
        </div>
        <div class="form-group">
            <label>Tiêu đề chạy chữ (Subtitle)</label>
            <input type="text" id="cfgSubtitle">
        </div>
        <div class="form-group">
            <label>Link Avatar (Ảnh đại diện)</label>
            <input type="text" id="cfgAvatar">
        </div>
        <div class="form-group">
            <label>Nội dung Cảnh báo Link</label>
            <textarea id="cfgWarning" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label>Link Discord</label>
            <input type="text" id="cfgDiscord">
        </div>
        <div class="form-group">
            <label>Link Telegram</label>
            <input type="text" id="cfgTelegram">
        </div>
        <div class="form-group">
            <label>Link YouTube</label>
            <input type="text" id="cfgYoutube">
        </div>
        <button class="btn-submit" onclick="saveSettings()">Lưu Cài Đặt</button>
    </div>

    <!-- 2. Thêm / Sửa Bài Đăng -->
    <div class="section">
        <h2 id="formTitle">Thêm Bài Đăng Mới</h2>
        <input type="hidden" id="editId">
        <div class="form-group">
            <label>Tên Mod / Bài đăng</label>
            <input type="text" id="upTitle" placeholder="VD: ASTUTECH OB55 ANTIBAN IOS">
        </div>
        <div class="form-group">
            <label>Link Tải (Download)</label>
            <input type="text" id="upLink" placeholder="VD: https://1short.link/l/...">
        </div>
        <div class="form-group">
            <label>Nền tảng</label>
            <select id="upPlatform">
                <option value="ios">iOS</option>
                <option value="android">Android</option>
            </select>
        </div>
        <div class="form-group">
            <label>Hình Ảnh (Chọn từ máy - Bỏ trống nếu giữ nguyên ảnh cũ khi sửa)</label>
            <input type="file" id="upImage" accept="image/*">
        </div>
        <button class="btn-submit" id="btnSaveMod" onclick="saveMod()">Upload Bài Đăng Lên Web</button>
        <button class="btn-submit" id="btnCancelEdit" style="background: #555; display: none;" onclick="resetForm()">Hủy Chỉnh Sửa</button>
    </div>

    <!-- 3. Danh sách bài đăng -->
    <div class="section">
        <h2>Danh Sách Bài Đăng Hiện Có</h2>
        <div class="mod-list" id="modList"></div>
    </div>

    <!-- Modal Sửa Ảnh/Nội dung (Chỉ dùng để xem trước) -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">×</button>
            <h3 style="margin-bottom: 15px;">Đang sửa bài viết...</h3>
            <p style="font-size: 0.9rem; color: var(--text-muted);">Vui lòng cuộn lên form phía trên để chỉnh sửa chi tiết.</p>
            <button class="btn-submit" onclick="closeModal()">Đã Hiểu</button>
        </div>
    </div>

    <script>
        // BẢO MẬT: Kiểm tra đăng nhập
        if (localStorage.getItem('isOwner') !== 'true') {
            alert('Bạn không có quyền truy cập!');
            window.location.href = 'index.html';
        }

        function logout() {
            localStorage.removeItem('isOwner');
            window.location.href = 'index.html';
        }

        // --- 1. QUẢN LÝ CÀI ĐẶT CHUNG ---
        const defaultConfig = {
            name: 'Khuong Duy',
            subtitle: "and i'm a Youtuber",
            avatar: "https://cdn.discordapp.com/attachments/1509742092170170432/1563637421743276032/aa4fe4bfef3d90caff36283ab86f635e.webp?ex=6ade5a54&is=6add08d4&hm=7a148123609c701ff6608772fc5ea0a68d106fb07a3ed6b3f28cdebbd4bdcaf4&",
            warning: "Nút Download/Get Key dùng dịch vụ rút gọn 1short.link và link4m. Cần vượt 1–2 bước quảng cáo trước khi tới file thật. Không nhập mật khẩu, không tải file lạ ngoài nội dung bài đăng. Nếu trang rút gọn yêu cầu đăng nhập tài khoản cá nhân — dừng lại ngay.",
            discord: "https://discord.gg/cMTHDRfr",
            telegram: "https://t.me/khduylato",
            youtube: "https://www.youtube.com/@khuongduylato"
        };

        function loadSettings() {
            const cfg = JSON.parse(localStorage.getItem('siteConfig')) || defaultConfig;
            document.getElementById('cfgName').value = cfg.name;
            document.getElementById('cfgSubtitle').value = cfg.subtitle;
            document.getElementById('cfgAvatar').value = cfg.avatar;
            document.getElementById('cfgWarning').value = cfg.warning;
            document.getElementById('cfgDiscord').value = cfg.discord;
            document.getElementById('cfgTelegram').value = cfg.telegram;
            document.getElementById('cfgYoutube').value = cfg.youtube;
        }

        function saveSettings() {
            const cfg = {
                name: document.getElementById('cfgName').value,
                subtitle: document.getElementById('cfgSubtitle').value,
                avatar: document.getElementById('cfgAvatar').value,
                warning: document.getElementById('cfgWarning').value,
                discord: document.getElementById('cfgDiscord').value,
                telegram: document.getElementById('cfgTelegram').value,
                youtube: document.getElementById('cfgYoutube').value
            };
            localStorage.setItem('siteConfig', JSON.stringify(cfg));
            alert('Đã lưu cài đặt chung!');
        }

        // --- 2. QUẢN LÝ BÀI ĐĂNG (THÊM, SỬA, XÓA) ---
        // Tạo dữ liệu mặc định cho lần đầu chạy (nếu chưa có data)
        const defaultMods = [
            {
                id: 1, title: "ASTUTECH OB55 ANTIBAN IOS", platform: "ios", date: "20/10",
                link: "https://1short.link/l/mefQd4", image: "https://cdn.discordapp.com/attachments/1509742092170170432/1563602738959483030/IMG_0500.png"
            },
            {
                id: 2, title: "KIPAS OB55 ANTIBAN IOS", platform: "ios", date: "20/10",
                link: "https://1short.link/l/1A2QW", image: "https://cdn.discordapp.com/attachments/1509742092170170432/1563602764582486046/IMG_0502.png"
            },
            {
                id: 3, title: "MIGUL OB55 IOS IPA", platform: "ios", date: "20/10",
                link: "https://1short.link/l/plHUxP", image: "https://cdn.discordapp.com/attachments/1509742092170170432/1563741933795545208/IMG_0512.jpg"
            },
            {
                id: 4, title: "TIKTOK MOD MỚI NHẤT IPA", platform: "ios", date: "20/10",
                link: "https://1short.link/l/clMut00S", image: "https://cdn.discordapp.com/attachments/1509742092170170432/1563745398596575272/IMG_0513.jpg"
            },
            {
                id: 5, title: "ASTUTECH OB55 ANTIBAN ANDROID FFTH", platform: "android", date: "20/10",
                link: "https://1short.link/l/HlA7fX", image: "https://cdn.discordapp.com/attachments/1509742092170170432/1563602764582486046/IMG_0502.png"
            },
            {
                id: 6, title: "ASTUTECH OB55 ANTIBAN ANDROID FFM", platform: "android", date: "20/10",
                link: "https://1short.link/l/fy2epTF", image: "https://cdn.discordapp.com/attachments/1509742092170170432/1563602751701782528/IMG_0501.png"
            },
            {
                id: 7, title: "KIPAS OB55 ANTIBAN ANDROID OB55 FFTH/FFM", platform: "android", date: "20/10",
                link: "", image: "https://cdn.discordapp.com/attachments/1509742092170170432/1563602816755302501/IMG_0506.png"
            },
            {
                id: 8, title: "TIKTOK MOD MỚI NHẤT ANDROID", platform: "android", date: "20/10",
                link: "https://1short.link/l/02GEh0Hi", image: "https://cdn.discordapp.com/attachments/1509742092170170432/1563745398596575272/IMG_0513.jpg"
            }
        ];

        if (!localStorage.getItem('siteMods')) {
            localStorage.setItem('siteMods', JSON.stringify(defaultMods));
        }

        function loadMods() {
            const modList = document.getElementById('modList');
            const mods = JSON.parse(localStorage.getItem('siteMods') || '[]');

            if (mods.length === 0) {
                modList.innerHTML = '<p style="color:#a0a0b0;">Chưa có bài đăng nào.</p>';
                return;
            }

            modList.innerHTML = '';
            mods.forEach(mod => {
                const card = document.createElement('div');
                card.className = 'mod-item';
                card.innerHTML = `
                    <img src="${mod.image}" alt="img">
                    <div class="mod-info">
                        <h3>${mod.title}</h3>
                        <p>Nền tảng: <b>${mod.platform.toUpperCase()}</b></p>
                        <p>Ngày: ${mod.date}</p>
                        <a href="${mod.link}" target="_blank" class="link">🔗 Link: ${mod.link || 'Chưa có'}</a>
                    </div>
                    <div class="action-btns">
                        <button class="btn-edit" onclick="editMod(${mod.id})">Sửa</button>
                        <button class="btn-delete" onclick="deleteMod(${mod.id})">Xóa</button>
                    </div>
                `;
                modList.appendChild(card);
            });
        }

        // Hàm Thêm / Sửa
        function saveMod() {
            const id = document.getElementById('editId').value;
            const title = document.getElementById('upTitle').value.trim();
            const link = document.getElementById('upLink').value.trim();
            const platform = document.getElementById('upPlatform').value;
            const imageFile = document.getElementById('upImage').files[0];

            if (!title || !link) { alert('Vui lòng nhập Tên và Link!'); return; }

            let mods = JSON.parse(localStorage.getItem('siteMods') || '[]');

            // Xử lý ảnh
            const processImage = (callback) => {
                if (imageFile) {
                    const reader = new FileReader();
                    reader.onload = (e) => callback(e.target.result);
                    reader.readAsDataURL(imageFile);
                } else {
                    // Nếu đang sửa và không chọn ảnh mới -> giữ nguyên ảnh cũ
                    const existing = mods.find(m => m.id == id);
                    callback(existing ? existing.image : 'https://via.placeholder.com/150');
                }
            };

            processImage((base64Img) => {
                if (id) {
                    // Sửa
                    const index = mods.findIndex(m => m.id == id);
                    if (index !== -1) {
                        mods[index] = { ...mods[index], title: title.toUpperCase(), link, platform, image: base64Img };
                    }
                } else {
                    // Thêm mới
                    mods.push({
                        id: Date.now(),
                        title: title.toUpperCase(),
                        link,
                        platform,
                        image: base64Img,
                        date: new Date().toLocaleDateString('vi-VN')
                    });
                }
                localStorage.setItem('siteMods', JSON.stringify(mods));
                alert(id ? 'Đã cập nhật bài đăng!' : 'Đã thêm bài đăng mới!');
                resetForm();
                loadMods();
            });
        }

        function editMod(id) {
            const mods = JSON.parse(localStorage.getItem('siteMods') || '[]');
            const mod = mods.find(m => m.id === id);
            if (!mod) return;

            document.getElementById('editId').value = mod.id;
            document.getElementById('upTitle').value = mod.title;
            document.getElementById('upLink').value = mod.link;
            document.getElementById('upPlatform').value = mod.platform;
            document.getElementById('upImage').value = ''; // Reset file input

            document.getElementById('formTitle').innerText = 'Chỉnh Sửa Bài Đăng';
            document.getElementById('btnSaveMod').innerText = 'Lưu Thay Đổi';
            document.getElementById('btnCancelEdit').style.display = 'block';
            
            window.scrollTo({ top: document.getElementById('formTitle').offsetTop - 50, behavior: 'smooth' });
        }

        function deleteMod(id) {
            if (!confirm('Bạn có chắc muốn xóa bài đăng này không?')) return;
            let mods = JSON.parse(localStorage.getItem('siteMods') || '[]');
            mods = mods.filter(m => m.id !== id);
            localStorage.setItem('siteMods', JSON.stringify(mods));
            loadMods();
        }

        function resetForm() {
            document.getElementById('editId').value = '';
            document.getElementById('upTitle').value = '';
            document.getElementById('upLink').value = '';
            document.getElementById('upImage').value = '';
            document.getElementById('formTitle').innerText = 'Thêm Bài Đăng Mới';
            document.getElementById('btnSaveMod').innerText = 'Upload Bài Đăng Lên Web';
            document.getElementById('btnCancelEdit').style.display = 'none';
        }

        function closeModal() { document.getElementById('editModal').classList.remove('active'); }

        // Chạy khởi tạo
        loadSettings();
        loadMods();
    </script>
</body>
</html>
