<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unlock Thành Công - Khuong Duy</title>
<style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #0f172a;
  --text-muted: #64748b;
  --border: #e2e8f0;
  --primary: #2563eb;
  --emerald: #10b981;
  --emerald-bg: rgba(16, 185, 129, 0.1);
  --emerald-border: rgba(16, 185, 129, 0.3);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.success-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 40px 30px;
  max-width: 420px;
  width: 100%;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.05);
}
.success-icon {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: var(--emerald-bg);
  border: 1px solid var(--emerald-border);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--emerald);
  margin-bottom: 20px;
}
.success-title {
  color: var(--emerald);
  font-size: 20px;
  font-weight: 800;
  text-transform: uppercase;
  margin-bottom: 12px;
  line-height: 1.4;
}
.success-desc {
  color: var(--text-muted);
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 24px;
}
.info-box {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 24px;
  text-align: left;
}
.info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.info-row:last-child { border-bottom: none; }
.info-label {
  color: var(--text-muted);
  font-size: 14px;
  font-weight: 600;
}
.info-value {
  font-weight: 800;
  font-size: 15px;
}
.info-value.uid { color: var(--primary); }
.info-value.time { color: var(--emerald); }
.btn-group {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.btn {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-decoration: none;
  transition: all 0.2s;
  border: none;
}
.btn-primary {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 4px 14px rgba(37,99,235,0.3);
}
.btn-primary:hover { background: #1d4ed8; transform: translateY(-1px); }
.btn-outline {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-outline:hover { background: #f1f5f9; }
</style>
</head>
<body>

<div class="success-card">
  <div class="success-icon">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
      <polyline points="22 4 12 14.01 9 11.01"/>
    </svg>
  </div>
  
  <h1 class="success-title">UID ĐÃ ĐƯỢC DUYỆT THÀNH CÔNG!</h1>
  <p class="success-desc">Hệ thống xác thực thành công. Tài khoản của bạn đã được cấp quyền truy cập máy chủ Private Server.</p>
  
  <div class="info-box">
    <div class="info-row">
      <span class="info-label">UID Game:</span>
      <span class="info-value uid" id="display-uid">Đang tải...</span>
    </div>
    <div class="info-row">
      <span class="info-label">Thời Hạn Bản Quyền:</span>
      <span class="info-value time">2 Giờ</span>
    </div>
  </div>

  <div class="btn-group">
    <a href="index.html" class="btn btn-primary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Mở Dashboard
    </a>
    <a href="unlock.html" class="btn btn-outline">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
      Về Trang Unlock
    </a>
  </div>
</div>

<script>
  // Hàm lấy tham số UID từ URL (VD: success.html?uid=123456789)
  function getUidFromUrl() {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get('uid');
  }

  const urlUid = getUidFromUrl();
  const savedUid = localStorage.getItem('ffaris_uid'); // Lấy từ bộ nhớ dự phòng
  
  const displayElement = document.getElementById('display-uid');

  // Ưu tiên hiển thị UID lấy từ URL (chuẩn xác nhất), nếu không có thì lấy từ bộ nhớ
  if (urlUid) {
    displayElement.textContent = urlUid;
  } else if (savedUid) {
    displayElement.textContent = savedUid;
  } else {
    displayElement.textContent = "Không tìm thấy UID";
  }
</script>

</body>
</html>
